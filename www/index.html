<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UMKM Tumbuh</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: #141419;
    color: #f2ede1;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .tunas { font-size: 56px; line-height: 1; }
  h1 { color: #d4af37; font-size: 28px; margin: 16px 0 8px; font-weight: 700; }
  p { color: #c9c4b8; font-size: 16px; line-height: 1.6; max-width: 340px; margin: 8px 0; }
  .kecil { font-size: 13px; color: #8a8578; }
  button {
    margin-top: 20px;
    background: #d4af37;
    color: #141419;
    border: 0;
    border-radius: 999px;
    padding: 14px 28px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    min-height: 48px;
  }
  button:active { transform: scale(0.98); }
</style>
</head>
<body>
  <div class="tunas">🌱</div>
  <h1>UMKM Tumbuh</h1>
  <p>Aplikasi membutuhkan koneksi internet untuk memuat data terbaru.</p>
  <p>Periksa koneksi internet Anda, lalu ketuk tombol di bawah.</p>
  <button type="button" onclick="location.reload()">Muat ulang</button>
  <p class="kecil">UMKM Tumbuh — Aplikasi Introspeksi UMKM</p>
</body>
</html>
